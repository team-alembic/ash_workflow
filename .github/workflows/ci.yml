name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # A pull request stacked on another feature branch gets no CI when this only
  # lists main, because the base branch is what is matched. Two such PRs sat
  # with no checks at all.
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  check:
    name: mix check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # No restore-keys: see the demo job's `_build` cache for why a build
      # restored from a different lock is worse than no cache at all.
      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: build-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - name: Cache dialyzer PLT
        uses: actions/cache@v6
        with:
          path: priv/plts
          # v2: earlier runs cached a PLT built on a developer machine, whose
          # absolute OTP paths do not exist on a runner. Bump on poisoning.
          key: plt-v2-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-v2-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # mix check runs compilation with warnings as errors, formatting, Credo,
      # dependency audits, the test suite with coverage, Dialyzer, docs, and the
      # vendored usage rules check.
      - run: mix check

  compile:
    name: compile (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound here is what mix.exs claims to support. The pairs are
        # the supported OTP versions for each Elixir release.
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: compile-deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: compile-deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      # No restore-keys: see the demo job's `_build` cache.
      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: compile-build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

  demos:
    name: demo (${{ matrix.demo }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        demo:
          - ats
          - document_approval
          - order_fulfilment
          - subscription_dunning
          - support_ticket_sla
          - workflow_timeline

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: demos/${{ matrix.demo }}

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          # Resolved from the repository root, not the demo directory: the
          # working-directory default above applies only to `run` steps.
          version-file: .tool-versions
          version-type: strict

      # `deps` may be restored from an older lock: `mix deps.get` reconciles it
      # against the current one.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: demos/${{ matrix.demo }}/deps
          key: demo-deps-${{ matrix.demo }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles(format('demos/{0}/mix.lock', matrix.demo)) }}
          restore-keys: demo-deps-${{ matrix.demo }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-

      # `_build` deliberately has no restore-keys. Nothing reconciles a build
      # against a lock it was not built from: a `_build` restored from before a
      # dependency was added leaves Mix believing everything is compiled, and
      # the missing dep surfaces as "could not find application file" at
      # startup rather than as a compile error. An exact-match-or-nothing key
      # means a lock change costs a cold build and buys a correct one.
      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: demos/${{ matrix.demo }}/_build
          key: demo-build-${{ matrix.demo }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles(format('demos/{0}/mix.lock', matrix.demo)) }}

      - run: mix deps.get

      # The demos are the integration test for the DSL: each drives real Oban
      # against real Postgres, so a change that breaks one breaks the build.
      - run: mix test
        env:
          MIX_ENV: test
