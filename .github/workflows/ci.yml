name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  check:
    name: mix check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: build-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache dialyzer PLT
        uses: actions/cache@v6
        with:
          path: priv/plts
          # v2: earlier runs cached a PLT built on a developer machine, whose
          # absolute OTP paths do not exist on a runner. Bump on poisoning.
          key: plt-v2-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-v2-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # mix check runs compilation with warnings as errors, formatting, Credo,
      # dependency audits, the test suite with coverage, Dialyzer, docs, and the
      # vendored usage rules check.
      - run: mix check

  compile:
    name: compile (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound here is what mix.exs claims to support. The pairs are
        # the supported OTP versions for each Elixir release.
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: compile-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: compile-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

  demos:
    name: demo (${{ matrix.demo }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        demo:
          - ats
          - document_approval
          - order_fulfilment
          - subscription_dunning
          - support_ticket_sla

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: demos/${{ matrix.demo }}

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          # Resolved from the repository root, not the demo directory: the
          # working-directory default above applies only to `run` steps.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            demos/${{ matrix.demo }}/deps
            demos/${{ matrix.demo }}/_build
          key: demo-${{ matrix.demo }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles(format('demos/{0}/mix.lock', matrix.demo)) }}
          restore-keys: demo-${{ matrix.demo }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # The demos are the integration test for the DSL: each drives real Oban
      # against real Postgres, so a change that breaks one breaks the build.
      - run: mix test
        env:
          MIX_ENV: test
