name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: mix hex.publish
    runs-on: ubuntu-latest
    environment: hex

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get

      # Guard against tagging a commit whose version was never bumped: the tag
      # and mix.exs must agree before anything is published.
      - name: Verify the tag matches the project version
        run: |
          project_version="$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])')"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mix.exs version ${project_version}."
            exit 1
          fi

          echo "Publishing ${project_version}."

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
