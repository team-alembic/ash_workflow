name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify-version:
    name: Verify the tag matches the project version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Guard against tagging a commit whose version was never bumped: the tag
      # and mix.exs must agree before anything is published. ash-ci.yml checks
      # that the version reached Hex, not that the tag names the right one.
      #
      # Read from the @version literal rather than Mix.Project.config/0, which
      # would mean fetching every dependency to print one string.
      - run: |
          project_version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ -z "$project_version" ]; then
            echo "No @version found in mix.exs."
            exit 1
          fi

          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mix.exs version ${project_version}."
            exit 1
          fi

          echo "Publishing ${project_version}."

  release:
    needs: verify-version
    uses: ash-project/ash/.github/workflows/ash-ci.yml@main
    with:
      release: true

      # HexDocs already receives the docs from `mix hex.publish`. The Pages
      # deploy is a second copy that needs Pages configured on the repository.
      publish-docs: false

      # Enforces ash-project's own community files byte for byte. This repo has
      # its own code of conduct, whose enforcement contact is Alembic's.
      community-files: false

      # Everything below duplicates a tool `mix check` already runs in ci.yml,
      # or does not apply to this library. See .check.exs for the real gate.
      unused-deps: false
      deps-audit: false
      hex-audit: false
      doctor: false
      codegen: false
      igniter-upgrade: false

      # Not a Phoenix app; no endpoints or templates for sobelow to analyse.
      sobelow: false

      # `mix check` runs `mix docs`, which regenerates the cheat sheets through
      # the `docs` alias and fails on a drifted DSL document.
      spark-cheat-sheets: false
      spark-formatter: false

      # The Postgres and Oban integration tests run in ci.yml, against the
      # postgres service defined there.
      postgres: false
      tenants: false
      ash_postgres: false

      conventional-commit: false

    # Validated when the file is parsed, so a nested job that never runs still
    # needs its permissions granted.
    permissions:
      contents: write
      pages: write
      id-token: write
      security-events: write

    secrets:
      hex_api_key: ${{ secrets.HEX_API_KEY }}
